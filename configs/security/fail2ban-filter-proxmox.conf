# ==============================================================================
# Filtre Fail2ban officiel pour l'interface Web Proxmox VE (pvedaemon)
# Emplacement cible : /etc/fail2ban/filter.d/proxmox.conf
# ==============================================================================

[Definition]
failregex = pvedaemon\[.*authentication failure; rhost=<HOST> user=.* msg=.*
ignoreregex =
journalmatch = _SYSTEMD_UNIT=pvedaemon.service
